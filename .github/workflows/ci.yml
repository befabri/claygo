name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Go tests (port + parity against committed goldens)
        run: go test ./...

      - name: Oracle reproducibility guard
        # Rebuilds the C oracle from the pinned clay.h, regenerates every golden,
        # and fails if any committed golden changed. Catches stale goldens and
        # clay.h bumps committed without regenerating. Also makes the oracle
        # binary present so go test's --list cross-check runs instead of skipping.
        run: make -C oracle verify
