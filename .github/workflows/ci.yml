name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Build oracle binaries
        run: make -C oracle all

      - name: Go tests (port + parity against committed goldens)
        run: go test ./...

      - name: Oracle reproducibility guard
        run: make -C oracle verify
